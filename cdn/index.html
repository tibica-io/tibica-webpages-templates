<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDN Assets</title>
  <link rel="stylesheet" href="output.css" />
</head>
<body class="bg-gray-50 min-h-screen p-8">

  <h1 class="text-2xl font-bold text-gray-800 mb-8">CDN Assets</h1>
  <div id="app" class="space-y-10"></div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-sm px-4 py-2 rounded-full opacity-0 transition-opacity duration-300 pointer-events-none">
    URL copied!
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    const IMAGE_EXT = new Set(['.svg', '.png', '.jpg', '.jpeg', '.webp', '.gif', '.ico', '.avif'])

    const FILE_ICONS = {
      '.pdf':  { icon: 'file-text',        color: 'text-red-500'    },
      '.txt':  { icon: 'file-text',        color: 'text-gray-500'   },
      '.md':   { icon: 'file-code',        color: 'text-blue-500'   },
      '.mp3':  { icon: 'file-audio',       color: 'text-purple-500' },
      '.wav':  { icon: 'file-audio',       color: 'text-purple-500' },
      '.ogg':  { icon: 'file-audio',       color: 'text-purple-500' },
      '.mp4':  { icon: 'file-video',       color: 'text-blue-400'   },
      '.mov':  { icon: 'file-video',       color: 'text-blue-400'   },
      '.json': { icon: 'file-json',        color: 'text-yellow-500' },
      '.csv':  { icon: 'file-spreadsheet', color: 'text-green-500'  },
      '.zip':  { icon: 'file-archive',     color: 'text-orange-400' },
    }

    function ext(filename) {
      return filename.slice(filename.lastIndexOf('.')).toLowerCase()
    }

    function showToast(msg) {
      const toast = document.getElementById('toast')
      toast.textContent = msg
      toast.classList.remove('opacity-0')
      toast.classList.add('opacity-100')
      setTimeout(() => {
        toast.classList.remove('opacity-100')
        toast.classList.add('opacity-0')
      }, 1500)
    }

    function copyUrl(folder, file) {
      const url = new URL(`./public/${folder}/${file}`, window.location.href).href
      navigator.clipboard.writeText(url).then(() => showToast('URL copied!'))
    }

    function downloadFile(folder, file) {
      const a = document.createElement('a')
      a.href = `./public/${folder}/${file}`
      a.download = file
      document.body.appendChild(a)
      a.click()
      document.body.removeChild(a)
    }

    function overlay(folder, file) {
      return `
        <div class="absolute inset-0 bg-black/50 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center justify-center gap-1 md:gap-3">
          <button onclick="copyUrl('${folder}', '${file}')" title="Copy URL"
            class="w-7 h-7 md:w-10 md:h-10 bg-white/90 hover:bg-white rounded-full flex items-center justify-center shadow-md transition-colors cursor-pointer">
            <i data-lucide="link" class="w-3 h-3 md:w-5 md:h-5 text-gray-700"></i>
          </button>
          <button onclick="downloadFile('${folder}', '${file}')" title="Download"
            class="w-7 h-7 md:w-10 md:h-10 bg-white/90 hover:bg-white rounded-full flex items-center justify-center shadow-md transition-colors cursor-pointer">
            <i data-lucide="download" class="w-3 h-3 md:w-5 md:h-5 text-gray-700"></i>
          </button>
        </div>`
    }

    function renderFile(folder, file) {
      const e = ext(file)

      if (IMAGE_EXT.has(e)) {
        return `
          <div class="flex flex-col items-center gap-2 group">
            <div class="w-[80px] h-[80px] md:w-[200px] md:h-[200px] relative flex items-center justify-center bg-white rounded-xl shadow-sm border border-gray-100 p-1 md:p-4">
              <img src="./public/${folder}/${file}" alt="${file}" class="max-w-full max-h-full object-contain" />
              ${overlay(folder, file)}
            </div>
            <span class="text-xs text-gray-400 truncate w-[80px] md:w-[200px] text-center" title="${file}">${file}</span>
          </div>`
      }

      const { icon, color } = FILE_ICONS[e] || { icon: 'file', color: 'text-gray-400' }
      return `
        <div class="flex flex-col items-center gap-2 group">
          <div class="w-[80px] h-[80px] md:w-[200px] md:h-[200px] relative flex items-center justify-center bg-white rounded-xl shadow-sm border border-gray-100">
            <i data-lucide="${icon}" class="w-8 h-8 md:w-24 md:h-24 ${color}"></i>
            ${overlay(folder, file)}
          </div>
          <span class="text-xs text-gray-400 truncate w-[80px] md:w-[200px] text-center" title="${file}">${file}</span>
        </div>`
    }

    async function loadAssets() {
      const res = await fetch('manifest.json')
      const manifest = await res.json()
      const app = document.getElementById('app')

      for (const [folder, files] of Object.entries(manifest)) {
        const section = document.createElement('section')
        const breadcrumb = folder.split('/').map((part, i, arr) =>
          i < arr.length - 1
            ? `<span class="text-gray-400">${part}</span><span class="text-gray-300 mx-1">/</span>`
            : `<span class="text-gray-700">${part}</span>`
        ).join('')
        section.innerHTML = `
          <h2 class="text-sm font-semibold uppercase tracking-wide mb-4">${breadcrumb}</h2>
          <div class="grid gap-3 md:gap-4 grid-cols-[repeat(auto-fill,minmax(80px,1fr))] md:grid-cols-[repeat(auto-fill,minmax(200px,1fr))]">
            ${files.length === 0
              ? '<p class="text-gray-400 text-sm col-span-full">No files found</p>'
              : files.map(f => renderFile(folder, f)).join('')}
          </div>`
        app.appendChild(section)
      }

      lucide.createIcons()
    }

    loadAssets()
  </script>

</body>
</html>
